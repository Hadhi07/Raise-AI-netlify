# Netlify config for RaiseAI static site
[build]
  command = "echo 'Static site — no build step needed (CSS is pre-compiled in /assets)'"
  publish = "."

# Cache static assets so repeat visitors don't re-download them (saves bandwidth)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
